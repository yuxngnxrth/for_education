# Раздел 4.3: защита SSH (раздел 4.2 меняет порт на 40000)
# Хост использует systemd-journald без rsyslog, поэтому auth.log не существует.
# Используем backend=systemd — читаем journal напрямую.
[ssh]
enabled       = true
port          = 40000
filter        = sshd
backend       = systemd
journalmatch  = _SYSTEMD_UNIT=sshd.service + _COMM=sshd
maxretry      = 4
