# Раздел 4.6 + 4.7: Nginx с HTTPS и HTTP Basic Auth для phpMyAdmin

# Перенаправление HTTP → HTTPS (раздел 4.6)
server {
    listen 8090;
    server_name _;

    location / {
        return 301 https://$host:8443$request_uri;
    }
}

# HTTPS-сервер (раздел 4.6)
server {
    listen 8443 ssl http2;
    server_name _;

    # TLS-параметры (раздел 4.6)
    ssl_protocols         TLSv1.2 TLSv1.3;
    ssl_certificate       /etc/nginx/ssl/pma.crt;
    ssl_certificate_key   /etc/nginx/ssl/pma.key;
    ssl_dhparam           /etc/nginx/ssl/dhparam.pem;
    ssl_session_timeout   10m;
    ssl_session_cache     shared:TLS:10m;
    ssl_session_tickets   off;
    ssl_ciphers           HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # HTTP Basic Auth (раздел 4.7)
    auth_basic           "Restricted Access!";
    auth_basic_user_file /etc/nginx/conf.d/.htpasswd;

    # Проксирование на phpMyAdmin (localhost:8082)
    location / {
        proxy_pass         http://127.0.0.1:8082;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }
}
