# Ищет:
#   1. Внутренние ошибки phpMyAdmin (error=1, login_failed, access_denied)
#   2. HTTP-ответы 401/403 от Nginx Basic Auth
[Definition]
failregex = ^<HOST> -.*"(GET|POST) /.*phpmyadmin.*(error=1|login_failed|access_denied).*HTTP.*".*$
            ^<HOST> -.*"(GET|POST) /.*phpmyadmin.*HTTP.*" (401|403) .*$

ignoreregex =
