[default]

; Основные внутренние номера (4-значные)
exten => 1000,1,Answer()
same => n,Playback(hello)
same => n,Hangup()

exten => 2000,1,Dial(PJSIP/2000)

; Специальный номер с записью num-was-successfully
exten => 5000,1,Answer()
same => n,Playback(num-was-successfully)
